[workspace]
resolver = "2"
members = [
    "crates/*",
    "tools/*",
]
exclude = ["modules/match"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devteapot/of"

[workspace.dependencies]
anyhow = "=1.0.100"
bevy = { version = "=0.19.0", default-features = false }
clap = { version = "=4.5.51", features = ["derive"] }
hex-core = { path = "crates/hex-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
spacetimedb-sdk = "=2.7.1"
thiserror = "=2.0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
